services:
  db:
    image: postgres:16-alpine
    container_name: PRD-1-NodeJs
    restart: always
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: my_prd-1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres"]

volumes:
  pgdata: